name: IaC static quality

on:
  pull_request:
  push:
    branches:
      - main
  schedule:
    - cron: "17 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  iac-static-quality:
    name: IaC static quality
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Set up pinned tooling
        uses: jdx/mise-action@v4.2.3
        with:
          # This action writes a CI-only .tool-versions file in its disposable
          # checkout. The IaC contract does not execute Python, so excluding
          # it avoids its legacy attestation gap without weakening verification
          # or changing the local developer toolchain.
          tool_versions: |
            terraform 1.12.2
            terragrunt 0.81.7
            tflint 0.54.0
            checkov 3.2.454
            actionlint 1.7.12

      - name: Run complete IaC quality contract
        run: mise exec -- make iac-static
